services:
  django:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: mars-explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DemoOnly
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: mars-explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DemoOnly
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mars-explorer"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    